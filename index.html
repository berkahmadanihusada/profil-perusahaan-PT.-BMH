<!DOCTYPE html>
<html lang="id">
<!--
GANTI FOTO: cukup upload file baru dengan NAMA YANG SAMA ke folder images/
 hero.jpg = latar bagian paling atas | band.jpg = latar Visi, Misi & Nilai | tentang.jpg = foto Tentang Kami
 or.jpg, esu.jpg, pend.jpg, set.jpg, cath.jpg = galeri Katalog Produk | logo.png = logo
-->

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="description" content="PT. Berkah Madani Husada, distributor alat bedah dan pengembangan rumah sakit, alat kedokteran, dan alat kesehatan lainnya di Jember, Jawa Timur.">
    <link rel="icon" href="images/logo.png">
    <title>PT. Berkah Madani Husada | Distributor Alat Kesehatan</title>
    
    <style>
        :root {
            --logo: url(images/logo.png);
            --hero: url(images/hero.jpg);
            --biz: url(images/band.jpg);
            --bg: #fff;
            --alt: #f3f6fa;
            --tx: #1c2b3d;
            --mut: #5d6c7e;
            --pri: #164a7c;
            --acc: #1b8a9a;
            --bd: #dde4ec;
            --navy: #0e2a47;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px);
        }

        @media (prefers-color-scheme: dark) {
            :root:not([data-theme="light"]) {
                --bg: #0f1b2b;
                --alt: #13233a;
                --tx: #e6edf5;
                --mut: #9fb1c6;
                --pri: #6db0e8;
                --acc: #4fc0cf;
                --bd: #26384f;
                --navy: #08121f;
            }
        }

        :root[data-theme="dark"] {
            --bg: #0f1b2b;
            --alt: #13233a;
            --tx: #e6edf5;
            --mut: #9fb1c6;
            --pri: #6db0e8;
            --acc: #4fc0cf;
            --bd: #26384f;
            --navy: #08121f;
        }

        * {
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
            scroll-padding-top: calc(64px + env(safe-area-inset-top, 0px));
        }

        body {
            margin: 0;
            background: var(--bg);
            color: var(--tx);
            font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
            line-height: 1.7;
            font-size: 16px;
        }

        .i {
            width: 1em;
            height: 1em;
            stroke: currentColor;
            fill: none;
            stroke-width: 1.8;
            stroke-linecap: round;
            stroke-linejoin: round;
            flex: none;
        }

        .w {
            max-width: 1040px;
            margin: 0 auto;
            padding: 0 20px;
        }

        .logo {
            background: var(--logo) center/contain no-repeat;
        }

        header {
            position: sticky;
            top: env(safe-area-inset-top, 0px);
            z-index: 10;
            background: var(--bg);
            border-bottom: 1px solid var(--bd);
        }

        header .w {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 60px;
            gap: 14px;
        }

        .br {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: 700;
            font-size: 14px;
            text-decoration: none;
            color: var(--tx);
        }

        .br .logo {
            width: 34px;
            height: 34px;
        }

        nav {
            display: flex;
            gap: 16px;
            overflow-x: auto;
        }

        nav a {
            font-size: 13px;
            color: var(--mut);
            text-decoration: none;
            white-space: nowrap;
        }

        nav a:hover {
            color: var(--pri);
        }

        .hero {
            background: linear-gradient(rgba(14, 42, 71, .82), rgba(14, 42, 71, .88)), var(--hero) center/cover;
            color: #fff;
            padding: 96px 0 88px;
        }

        .hero small {
            letter-spacing: .14em;
            text-transform: uppercase;
            font-size: 12px;
            opacity: .85;
        }

        .hero h1 {
            font-size: clamp(28px, 4.5vw, 42px);
            margin: 10px 0 12px;
            line-height: 1.2;
            font-weight: 700;
        }

        .hero p {
            max-width: 560px;
            margin: 0 0 24px;
            opacity: .92;
        }

        .btn {
            display: inline-block;
            font-size: 13px;
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 6px;
            text-decoration: none;
            background: var(--acc);
            color: #fff;
            border: 1px solid var(--acc);
        }

        .btn.o {
            background: transparent;
            border-color: rgba(255, 255, 255, .6);
            margin-left: 8px;
        }

        section {
            padding: 60px 0;
        }

        .alt {
            background: var(--alt);
        }

        .k {
            font-size: 12px;
            letter-spacing: .14em;
            text-transform: uppercase;
            color: var(--acc);
            font-weight: 700;
        }

        h2 {
            font-size: 26px;
            margin: 4px 0 14px;
            line-height: 1.25;
            color: var(--pri);
        }

        p {
            margin: 0 0 12px;
        }

        .mut {
            color: var(--mut);
        }

        .two {
            display: grid;
            grid-template-columns: 1.2fr 1fr;
            gap: 36px;
            align-items: center;
        }

        .ph {
            width: 100%;
            border-radius: 8px;
            display: block;
            box-shadow: 0 6px 20px rgba(14, 42, 71, .15);
        }

        .g {
            display: grid;
            gap: 16px;
            margin-top: 22px;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
        }

        .c {
            background: var(--bg);
            border: 1px solid var(--bd);
            border-radius: 8px;
            padding: 20px;
        }

        .alt .c {
            background: var(--bg);
        }

        .c .i {
            font-size: 24px;
            color: var(--acc);
            margin-bottom: 8px;
        }

        .c h3 {
            margin: 0 0 4px;
            font-size: 16px;
            color: var(--pri);
        }

        .c p {
            margin: 0;
            font-size: 14.5px;
            color: var(--mut);
        }

        .band {
            background: linear-gradient(rgba(14, 42, 71, .88), rgba(14, 42, 71, .92)), var(--biz) center/cover;
            color: #fff;
        }

        .band h2,
        .band .k {
            color: #fff;
        }

        .band .k {
            color: #8fd8e3;
        }

        .vm {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            margin-top: 20px;
        }

        .vm div {
            border: 1px solid rgba(255, 255, 255, .25);
            border-radius: 8px;
            padding: 20px;
            background: rgba(255, 255, 255, .06);
        }

        .vm h3 {
            margin: 0 0 6px;
            font-size: 16px;
            color: #8fd8e3;
        }

        .vm p {
            margin: 0;
            font-size: 15px;
            opacity: .95;
        }

        .nil {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 20px;
        }

        .nil span {
            border: 1px solid rgba(255, 255, 255, .35);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 14px;
        }

        .chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin-top: 16px;
        }

        .chips span {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            border: 1px solid var(--bd);
            background: var(--bg);
            padding: 5px 14px;
            border-radius: 999px;
            font-size: 14px;
        }

        .chips .i {
            color: var(--acc);
        }

        .gal {
            display: grid;
            gap: 14px;
            margin-top: 22px;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        }

        .gal figure {
            margin: 0;
            border: 1px solid var(--bd);
            border-radius: 8px;
            overflow: hidden;
            background: #fff;
        }

        .gal img {
            width: 100%;
            height: 150px;
            object-fit: contain;
            display: block;
            padding: 6px;
        }

        .gal figcaption {
            padding: 8px 12px;
            font-size: 13.5px;
            border-top: 1px solid var(--bd);
            background: var(--bg);
            color: var(--tx);
        }

        .ls {
            list-style: none;
            margin: 16px 0 0;
            padding: 0;
            display: grid;
            gap: 8px;
            grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
        }

        .ls li {
            display: flex;
            gap: 10px;
            align-items: center;
            padding: 10px 14px;
            border: 1px solid var(--bd);
            border-radius: 8px;
            background: var(--bg);
            font-size: 15px;
        }

        .ls .i {
            color: var(--acc);
            font-size: 20px;
        }

        .ct {
            display: grid;
            gap: 16px;
            grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
            margin-top: 20px;
        }

        .ct a {
            color: var(--pri);
            text-decoration: none;
        }

        footer {
            background: var(--navy);
            color: #b9c8da;
            padding: 26px 0;
            text-align: center;
            font-size: 13px;
        }

        footer .logo {
            width: 44px;
            height: 44px;
            margin: 0 auto 8px;
        }

        .news {
            display: grid;
            gap: 16px;
            margin-top: 22px;
            grid-template-columns: repeat(auto-fill, minmax(150px, 220px));
            justify-content: start;
        }

        .nc {
            border: 1px solid var(--bd);
            border-radius: 8px;
            overflow: hidden;
            background: var(--bg);
            display: flex;
            flex-direction: column;
        }

        .nc img {
            width: 100%;
            aspect-ratio: 3/4;
            object-fit: cover;
            object-position: center 25%;
            display: block;
            background: var(--alt);
        }

        .nc .b {
            padding: 12px 14px 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
            flex: 1;
        }

        .nc .m {
            font-size: 12px;
            color: var(--mut);
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .nc .t {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: .06em;
            text-transform: uppercase;
            color: var(--acc);
        }

        .nc h3 {
            margin: 0;
            font-size: 15px;
            color: var(--pri);
            line-height: 1.35;
        }

        .nc p {
            margin: 0;
            font-size: 13.5px;
            color: var(--mut);
            display: -webkit-box;
            -webkit-line-clamp: 6;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .nc a.more {
            font-size: 13px;
            color: var(--pri);
            text-decoration: none;
            font-weight: 600;
            margin-top: auto;
        }

        .upd {
            display: inline-block;
            font-size: 12px;
            border: 1px solid var(--bd);
            border-radius: 999px;
            padding: 2px 12px;
            color: var(--mut);
            margin-left: 8px;
            vertical-align: middle;
            letter-spacing: 0;
            text-transform: none;
            font-weight: 600;
        }

        .gal .wa {
            display: block;
            font-size: 12.5px;
            font-weight: 600;
            text-align: center;
            text-decoration: none;
            color: var(--acc);
            padding: 8px 10px;
            border-top: 1px solid var(--bd);
        }

        .gal .wa:hover {
            background: var(--alt);
        }

        @media(max-width: 760px) {
            .two {
                grid-template-columns: 1fr;
            }

            .hero {
                padding: 64px 0 56px;
            }

            .btn.o {
                margin: 8px 0 0;
            }
        }
    </style>
</head>
